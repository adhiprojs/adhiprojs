name: Contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-dark.svg?palette=github-dark&color_snake=#e0782f&color_dots=#161b22,#123047,#1b4a6e,#2a6a9c,#5cc8e6
            dist/contributions-light.svg?color_snake=#c4621f&color_dots=#ebedf0,#c9dff0,#8fbde0,#4b93c8,#1f5a86

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
